[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-testing"
version = "0.1.0"
description = "Reusable, language-independent test command runner"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Dialovos/automatic-testing"

[project.scripts]
testkit = "testing_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
